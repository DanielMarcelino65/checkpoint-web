services:
  postgres:
    image: postgres:16-alpine
    container_name: checkpoint_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkpoint
      POSTGRES_PASSWORD: checkpoint12345
      POSTGRES_DB: checkpoint_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: